# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
# This setting speeds up running single tasks from subprojects by only configuring what's needed.
# see https://docs.gradle.org/current/userguide/multi_project_configuration_and_execution.html
# Disabled because this breaks ForgeGradle tasks
org.gradle.configureondemand=false
org.gradle.caching=true
# ForgeGradle run tasks used by check are not compatible with the configuration cache.
org.gradle.configuration-cache=false

# MezzConfig GUI
modName=MezzConfig GUI
modId=mezz_config_gui
configGuiApiModId=mezz_config_gui_api
configGuiModId=mezz_config_gui
configApiModId=mezz_config_api
configModId=mezz_config
configModGroup=net.mezzdev.config
modAuthor=mezz
# http://maven.apache.org/guides/mini/guide-naming-conventions.html
modGroup=net.mezzdev.config
modDescription=Shared config GUI support for Minecraft mods.
# Mojang ships Java 21 to end users in 1.20.5+
modJavaVersion=21
githubUrl=https://github.com/mezz/MezzConfigGui

# Publishing
# Supply curseProjectId and modrinthId as Gradle properties after creating the project listings.

# Minecraft
minecraftVersion=1.21.1
minecraftVersionRange=[1.21.1, 1.21.2)
# https://projects.neoforged.net/neoforged/neoform
neoformTimestamp=20240808.144430

# Forge
# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.21.1.html
forgeVersion=52.1.16
forgeLoaderVersionRange=[51,)
# minimum version for
# "Add a way to render tooltips from Formatted text and TooltipComponents elements (#10056)"
# https://github.com/MinecraftForge/MinecraftForge/pull/10056#event-13755707083
forgeVersionRange=[51.0.31,)

# NeoForge
# https://projects.neoforged.net/neoforged/neoforge
neoforgeVersion=21.1.249
neoforgeLoaderVersionRange=[4,)
# minimum version for
# "Add a way to render tooltips from Formatted text and TooltipComponents elements (#1364)"
# https://github.com/neoforged/NeoForge/pull/1364
neoforgeVersionRange=[21.0.118-beta,)
neogradle.subsystems.conventions.runs.create-default-run-per-type=false

# Fabric
# https://fabricmc.net/develop/
fabricLoaderVersion=0.19.5
fabricApiVersion=0.116.17+1.21.1
fabricLoaderVersionRange=>=0.16.3
fabricApiVersionRange=>=0.102.0+1.21
modMenuVersionFabric=11.0.3

# AMECS (Fabric only, for keybinds with modifiers)
# https://maven.siphalor.de/de/siphalor/amecsapi-1.20/maven-metadata.xml
amecsMinecraftVersion=1.20
amecsVersionFabric=1.5.6+mc1.20.2

# Mappings
# https://parchmentmc.org/docs/getting-started
parchmentMinecraftVersion=1.21.1
parchmentVersionForge=2024.11.17-1.21.1
parchmentVersionFabric=2024.11.17

# Test
jUnitVersion=6.1.3

# Dependencies
mixinVersion=0.8.5
mezzConfigVersion=0.5.9
mezzConfigFabricVersionRange=>=0.5.9
mezzConfigVersionRange=[0.5.9,)
jeiVersion=19.39.0.372
guavaVersion=31.1-jre
jetbrainsAnnotationsVersion=26.1.0
jsr305Version=3.0.2
fastutilVersion=8.5.6
log4jVersion=2.17.0

# Version
specificationVersion=0.3.0
# The first released CommonApi artifact becomes the permanent compatibility baseline.
apiBaselineVersion=0.1.0
# Set this to true after 0.1.0 is published so an unavailable baseline fails verification.
apiBaselineRequired=false
