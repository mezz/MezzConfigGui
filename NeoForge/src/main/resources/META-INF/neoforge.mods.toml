modLoader="javafml"
loaderVersion="${neoforgeLoaderVersionRange}"
issueTrackerURL="${githubUrl}/issues?q=is%3Aissue"
license="The MIT License (MIT)"

[[mods]]
modId="${configGuiModId}"
version="${version}"
displayName="Mezz Config GUI"
displayURL="${githubUrl}"
displayTest="IGNORE_SERVER_VERSION"
logoFile="mezz_config_gui-icon.png"
authors="${modAuthor}"
description='''
Shared config GUI support for Minecraft mods.
'''

[[dependencies.${configGuiModId}]]
    modId="neoforge"
    type="required"
    versionRange="${neoforgeVersionRange}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${configGuiModId}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraftVersionRange}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${configGuiModId}]]
    modId="${configModId}"
    type="required"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${configGuiModId}]]
    modId="jei"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"
