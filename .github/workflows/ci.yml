name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java toolchains
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # ForgeGradle resolves its launcher with Java 8 and runs Mavenizer with Java 25.
          # Keep Java 21 last so Gradle and Minecraft use this branch's target JDK.
          java-version: |
            8
            25
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and check
        run: ./gradlew --stacktrace spotlessCheck build :Common:apiJavadoc :Common:checkJarCompatibility

      - name: Check release metadata without publishing
        run: ./gradlew --stacktrace publishMods -PpublishDryRun=true
