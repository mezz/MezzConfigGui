name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out MezzConfigGui
        uses: actions/checkout@v7
        with:
          path: MezzConfigGui

      - name: Check out MezzConfig
        uses: actions/checkout@v7
        with:
          repository: mezz/MezzConfig
          ref: 1.21.1
          path: MezzConfig

      - name: Check out JEI API baseline
        uses: actions/checkout@v7
        with:
          repository: mezz/JustEnoughItems
          ref: v19.39.0
          path: justenoughitems1.21.1

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build JEI API baseline
        working-directory: justenoughitems1.21.1
        run: ./gradlew --stacktrace :CommonApi:jar

      - name: Build MezzConfig dependency publications
        working-directory: MezzConfig
        run: ./gradlew --stacktrace validatePublishing

      - name: Validate builds, API, documentation, and publications
        working-directory: MezzConfigGui
        run: >-
          ./gradlew --stacktrace
          -PuseMezzConfigCompositeBuild=false
          -PDEPLOY_DIR=${{ github.workspace }}/MezzConfig/build/publication-validation
          spotlessCheck
          :mezz_config_gui-1.21.1-config-gui-api:build
          :mezz_config_gui-1.21.1-config-gui:build
          :mezz_config_gui-1.21.1-fabric:build
          :mezz_config_gui-1.21.1-forge:build
          :mezz_config_gui-1.21.1-neoforge:build
          :FabricMezzConfigDefaultsTest:build
          :FabricMezzConfigCustomTest:build
          :NeoForgeNativeDefaultsTest:build
          :NeoForgeNativeCustomTest:build
          validatePublishing
